[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "classscribe"
version = "0.1.0"
description = "Record internal Mac audio, transcribe it locally with whisper.cpp, and summarize with a free LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pablo Molina" }]
keywords = ["whisper", "transcription", "study-notes", "groq", "macos", "blackhole"]
dependencies = []

[project.urls]
Homepage = "https://github.com/pmolina18/classscribe"
Issues = "https://github.com/pmolina18/classscribe/issues"

[project.scripts]
classscribe = "classscribe.cli:main"

[tool.setuptools.packages.find]
include = ["classscribe*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pyflakes (F) + a focused slice of pycodestyle (E) for real errors.
# Deliberately NOT enabling flake8-bandit (S): this is a local CLI that shells
# out to ffmpeg/whisper by design, so S603/S607 are noise here.
select = ["F", "E4", "E7", "E9"]
ignore = ["E701", "E702"]  # intentional one-line parser setup in cli.py.
